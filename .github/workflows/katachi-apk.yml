name: Katachi APK

on:
  push:
    branches: [clean/katachi]
    paths: ["katachi-android/**", ".github/workflows/katachi-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: katachi-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      # The Lume core libraries are committed in app/src/main/jniLibs, so no NDK is needed here.
      - run: gradle -PcoreOnly :core:test
      - run: gradle :app:assembleRelease
      - run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Katachi-0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Katachi-0.1.0
          path: katachi-android/app/build/outputs/apk/release/Katachi-0.1.0.apk
