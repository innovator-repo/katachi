name: Katachi APK

on:
  push:
    branches: [clean/katachi]
    paths: ["katachi-android/**", ".github/workflows/katachi-apk.yml"]
  workflow_dispatch:

# Builds the APK, tests it on an Android emulator, and only uploads it once
# the emulator run passes.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: katachi-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      # The Lume core libraries are committed in app/src/main/jniLibs, so no NDK is needed here.
      - run: gradle -PcoreOnly :core:test
      - run: gradle :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Free disk space for the emulator
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: katachi-android
          script: |
            gradle :app:connectedDebugAndroidTest
            tools/smoke.sh app/build/outputs/apk/release/app-release.apk
      - name: Keep the emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs
          path: |
            katachi-android/smoke-screen.png
            katachi-android/smoke-logcat.txt
            katachi-android/app/build/reports/androidTests/
            katachi-android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
      - run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Katachi-0.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Katachi-0.3.0
          path: katachi-android/app/build/outputs/apk/release/Katachi-0.3.0.apk
